{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://locktool.com/#org",
        "name": "Locktool",
        "url": "https://locktool.com/",
        "description": "Professional Locksmith Tools & Lock Technology Resources",
        "logo": "https://locktool.com/assets/logo.png"
      },
      {
        "@type": "WebSite",
        "@id": "https://locktool.com/#website",
        "url": "https://locktool.com/",
        "name": "Locktool",
        "publisher": { "@id": "https://locktool.com/#org" }
      }
    ]
  }
  </script>
  {% if page and page.title %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "@id": "{{ config.site_url | trim('/') }}/{{ page.url }}#article",
    "headline": "{{ page.title | e }}",
    "url": "{{ config.site_url | trim('/') }}/{{ page.url }}",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ config.site_url | trim('/') }}/{{ page.url }}"
    },
    "author": {
      "@type": "Organization",
      "@id": "https://locktool.com/#org"
    },
    "publisher": {
      "@id": "https://locktool.com/#org"
    },
    "isPartOf": {
      "@type": "WebSite",
      "@id": "https://locktool.com/#website"
    },
    "inLanguage": "en"
  }
  </script>
  {% endif %}
{% endblock %}
